name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        # Reads minimum_zig_version from build.zig.zon and caches Zig build data.

      - name: Check formatting
        if: runner.os == 'Linux'
        run: zig fmt --check build.zig build.zig.zon src examples

      - name: Build
        run: zig build --summary all

      - name: Test (Debug)
        run: zig build test --summary all

      - name: Test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all

      - name: Test (ReleaseFast)
        run: zig build test -Doptimize=ReleaseFast --summary all

      - name: Test (ReleaseSmall)
        run: zig build test -Doptimize=ReleaseSmall --summary all

      - name: Run example
        run: zig build example --summary all
